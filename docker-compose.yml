services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refferq-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://refferq:refferq@db:5432/refferq
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-random-string-min-32-chars}
      - PLUNK_API_URL=${PLUNK_API_URL:-https://next-api.useplunk.com}
      - PLUNK_SECRET_KEY=${PLUNK_SECRET_KEY:-}
      - PLUNK_FROM_EMAIL=${PLUNK_FROM_EMAIL:-hello@lazi.studio}
      - PLUNK_FROM_NAME=${PLUNK_FROM_NAME:-LAZI}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - refferq-network

  db:
    image: postgres:16-alpine
    container_name: refferq-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=refferq
      - POSTGRES_PASSWORD=refferq
      - POSTGRES_DB=refferq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refferq"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - refferq-network

volumes:
  postgres_data:

networks:
  refferq-network:
    driver: bridge
